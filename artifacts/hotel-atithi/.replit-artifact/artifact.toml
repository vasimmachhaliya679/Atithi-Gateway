kind = "web"
previewPath = "/"
title = "Hotel Atithi"
version = "1.0.0"
id = "artifacts/hotel-atithi"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22610
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/hotel-atithi run dev"

[services.env]
PORT = "22610"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/hotel-atithi", "run", "build"]
publicDir = "artifacts/hotel-atithi/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
